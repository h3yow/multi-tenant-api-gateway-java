server.port=8080

# 固定限流窗口长度（毫秒）。窗口按 epoch 对齐：窗口起点 = floor(now / 长度) * 长度。
gateway.rate-limit-window-millis=60000

# 让认证 / 限流 / 幂等 / 审计的判定过程在控制台可见，便于本地验证与测试追溯。
logging.level.com.github.h3yow.multitenantapigatewayjava.gateway=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
